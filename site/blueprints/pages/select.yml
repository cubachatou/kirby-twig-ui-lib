title: Select
icon: angle-down

sections:
  content:
    type: fields
    fields:
      title:
        type: text
        required: true
      excerpt:
        type: text
        label: Excerpt
        help: Short description shown in search results and the page meta description.
      intro:
        type: writer
        label: Intro
        help: Lead paragraph displayed beneath the title. Keep it to 1–2 sentences.
        marks:
          - bold
          - italic
          - code
          - link

      usage:
        type: blocks
        label: Usage
        help: Installation steps and basic usage. Renders before the examples on the doc page.
        fieldsets:
          - heading
          - text
          - code
          - list

      demo_default:
        type: blocks
        label: "Example — Default (live preview)"
        help: A basic select with a flat list of options.
        fieldsets:
          - kui-select

      demo_default_code:
        type: blocks
        label: "Example — Default (usage code)"
        help: Code snippet shown below the live preview.
        fieldsets:
          - code

      demo_groups:
        type: blocks
        label: "Example — Groups (live preview)"
        help: Select with grouped options using SelectGroup, SelectLabel, and SelectSeparator.
        fieldsets:
          - kui-select

      demo_groups_code:
        type: blocks
        label: "Example — Groups (usage code)"
        help: Code snippet shown below the live preview.
        fieldsets:
          - code

      demo_scrollable:
        type: blocks
        label: "Example — Scrollable (live preview)"
        help: A select with many items that scrolls within the popup.
        fieldsets:
          - kui-select

      demo_scrollable_code:
        type: blocks
        label: "Example — Scrollable (usage code)"
        help: Code snippet shown below the live preview.
        fieldsets:
          - code

      demo_disabled:
        type: blocks
        label: "Example — Disabled (live preview)"
        help: Select with the Disabled setting enabled.
        fieldsets:
          - kui-select

      demo_disabled_code:
        type: blocks
        label: "Example — Disabled (usage code)"
        help: Code snippet shown below the live preview.
        fieldsets:
          - code

      body:
        type: blocks
        label: Body
        help: Add sections below the examples (Extending, API Reference, Blueprint fields, Accessibility…)
        fieldsets:
          - heading
          - text
          - code
          - list
          - table
          - quote
