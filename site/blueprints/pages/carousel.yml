title: Carousel
icon: image

sections:
  content:
    type: fields
    fields:
      title:
        type: text
        required: true
      excerpt:
        type: text
        label: Excerpt
        help: Short description shown in search results and the page meta description.
      intro:
        type: writer
        label: Intro
        help: Lead paragraph displayed beneath the title. Keep it to 1–2 sentences.
        marks:
          - bold
          - italic
          - code
          - link
      usage:
        type: blocks
        label: Usage
        help: Installation steps and basic usage. Renders before the examples on the doc page.
        fieldsets:
          - heading
          - text
          - code
          - list

      demo:
        type: blocks
        label: "Example — Basic (live preview)"
        help: Standard carousel with no navigation or pagination.
        fieldsets:
          - kui-carousel

      demo_code:
        type: blocks
        label: "Example — Basic (usage code)"
        help: Code snippet shown below the live preview.
        fieldsets:
          - code

      demo_navigation:
        type: blocks
        label: "Example — Navigation (live preview)"
        help: Carousel with previous/next arrow buttons enabled.
        fieldsets:
          - kui-carousel

      demo_navigation_code:
        type: blocks
        label: "Example — Navigation (usage code)"
        help: Code snippet shown below the live preview.
        fieldsets:
          - code

      demo_pagination:
        type: blocks
        label: "Example — Pagination (live preview)"
        help: Carousel with clickable dot indicators enabled.
        fieldsets:
          - kui-carousel

      demo_pagination_code:
        type: blocks
        label: "Example — Pagination (usage code)"
        help: Code snippet shown below the live preview.
        fieldsets:
          - code

      body:
        type: blocks
        label: Body
        help: Add sections below the examples (Extending, API Reference, Blueprint fields, Accessibility…)
        fieldsets:
          - heading
          - text
          - code
          - list
          - table
          - quote
