title: Accordion
icon: list

sections:
  content:
    type: fields
    fields:
      title:
        type: text
        required: true
      excerpt:
        type: text
        label: Excerpt
        help: Short description shown in search results and the page meta description.
      intro:
        type: writer
        label: Intro
        help: Lead paragraph displayed beneath the title. Keep it to 1–2 sentences.
        marks:
          - bold
          - italic
          - code
          - link
      usage:
        type: blocks
        label: Usage
        help: Installation steps and basic usage. Renders before the examples on the doc page.
        fieldsets:
          - heading
          - text
          - code
          - list

      demo:
        type: blocks
        label: "Example — Basic (live preview)"
        help: Single-open accordion. Renders live on the doc page.
        fieldsets:
          - kui-accordion

      demo_code:
        type: blocks
        label: "Example — Basic (usage code)"
        help: Code snippet shown below the live preview.
        fieldsets:
          - code

      demo_multiple:
        type: blocks
        label: "Example — Multiple (live preview)"
        help: Accordion with Allow Multiple Open enabled.
        fieldsets:
          - kui-accordion

      demo_multiple_code:
        type: blocks
        label: "Example — Multiple (usage code)"
        help: Code snippet shown below the live preview.
        fieldsets:
          - code

      demo_disabled:
        type: blocks
        label: "Example — Disabled (live preview)"
        help: Accordion containing a disabled item.
        fieldsets:
          - kui-accordion

      demo_disabled_code:
        type: blocks
        label: "Example — Disabled (usage code)"
        help: Code snippet shown below the live preview.
        fieldsets:
          - code

      demo_bordered:
        type: blocks
        label: "Example — Borders (live preview)"
        help: Accordion with the accordion--bordered CSS modifier.
        fieldsets:
          - kui-accordion

      demo_bordered_code:
        type: blocks
        label: "Example — Borders (usage code)"
        help: Code snippet shown below the live preview.
        fieldsets:
          - code

      body:
        type: blocks
        label: Body
        help: Add sections below the examples (Installation, Fields, JS API, Accessibility…)
        fieldsets:
          - heading
          - text
          - code
          - list
          - table
          - quote
